{% extends "base.html" %}
{% block title %}首页{% endblock %}
{% block content %}
<section class="hero">
    <h1>我的日记回溯</h1>
    <p class="sub">共 <strong>{{ total_entries }}</strong> 篇日记 · 约 <strong>{{ "{:,}".format(total_words) }}</strong> 字 · 数据库只读访问</p>
</section>

<h2 class="section-title">按年份浏览</h2>
<div class="year-grid">
    {% for y in years %}
    <a class="year-card" href="/browse?year={{ y.year }}#list">
        <div class="year-num">{{ y.year }}</div>
        <div class="year-meta">
            <span>{{ y.entries }} 篇</span>
            <span>{{ "{:,}".format(y.words) }} 字</span>
        </div>
    </a>
    {% endfor %}
</div>

<section class="hero secondary">
    <a class="btn-primary" href="/on-this-day">✨ 看看过去的今天</a>
</section>
{% endblock %}
